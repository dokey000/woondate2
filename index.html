<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>운사연애</title>
<link rel="preload" as="image" href="woonhak_wallpaper.jpeg">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { height: 100%; }
  body {
    background: #111; color: #fff;
    display: flex; justify-content: center; align-items: center;
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }

  /* 휴대폰 화면 */
  .phone {
    position: relative; overflow: hidden;
    width: min(100vw, 390px); height: min(100dvh, 844px);
    border-radius: 44px;
    background: #222 url('wallpaper.jpeg') center / cover no-repeat;
    box-shadow: 0 0 0 8px #000, 0 0 0 10px #333;
  }
  @media (max-width: 500px) {
    .phone { width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; }
  }
  .layer { position: absolute; inset: 0; transition: transform .4s ease, opacity .35s ease; }
  .layer.drag { transition: none; }
  .shadow { text-shadow: 0 1px 8px rgba(0,0,0,.45); }

  /* 사진을 불러오는 동안은 파일 이름 글자를 숨겨요.
     사진 파일이 없어서 img 가 지워지면 이 규칙이 풀려서 이름이 다시 보여요. */
  span:has(+ img[onload]) { visibility: hidden; }

  /* ---------- 잠금화면 ---------- */
  #lock { z-index: 30; touch-action: none; display: flex; flex-direction: column; align-items: center; }
  #lock .time {
     margin-top: 88px;
     font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
     font-size: 88px;
     font-weight: 200;
     line-height: 1;
     letter-spacing: -4.2px;
     font-variant-numeric: tabular-nums;
     text-shadow: 0 1px 10px rgba(0,0,0,.12);
   }
  #lock .date { margin-top: 10px; font-size: 18px; font-weight: 500; }
  .qbtn {
    position: absolute; bottom: 74px; width: 50px; height: 50px; border-radius: 50%;
    background: rgba(0,0,0,.35); backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center; font-size: 22px;
    pointer-events: none;
  }
  .qbtn.left { left: 40px; }
  .qbtn.right { right: 40px; }
  .qbtn img { width: 24px; height: 24px; object-fit: contain; filter: brightness(0) invert(1); }
  .hint { position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; font-size: 14px; cursor: pointer; }
  .hint::after { content: ""; display: block; width: 130px; height: 5px; margin: 10px auto 0; border-radius: 3px; background: #fff; }

  /* ---------- 암호 입력 ---------- */
  #pass {
    z-index: 20; opacity: 0; pointer-events: none;
    background: rgba(0,0,0,.35); backdrop-filter: blur(26px); -webkit-backdrop-filter: blur(26px);
    display: flex; flex-direction: column; align-items: center; padding-top: 80px;
  }
  #pass.active { pointer-events: auto; }
  #pass .title { font-size: 18px; }
  .dots { display: flex; gap: 18px; margin: 28px 0 40px; }
  .dots span { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid #fff; }
  .dots span.on { background: #fff; }
  .dots.shake { animation: shake .4s; }
  @keyframes shake { 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }
  .keys { display: grid; grid-template-columns: repeat(3, 76px); gap: 16px 22px; }
  .key {
    width: 76px; height: 76px; border-radius: 50%; border: 0; color: #fff; font-size: 30px; font-weight: 300;
    background: rgba(255,255,255,.2); cursor: pointer; font-family: inherit;
  }
  .key:active { background: rgba(255,255,255,.45); }
  .key.blank { background: none; pointer-events: none; }
  .key.emergency { background: none; font-size: 15px; pointer-events: none; }
  .key.text { background: none; font-size: 17px; }

  /* ---------- 홈화면 ---------- */
  #home { z-index: 10; padding: 70px 20px 0; opacity: 0; pointer-events: none; transform: scale(1.12); }
  #home.show { opacity: 1; pointer-events: auto; transform: none; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px 0; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; text-shadow: 0 1px 6px rgba(0,0,0,.5); cursor: pointer; }
  .icon {
    position: relative; width: 60px; height: 60px; border-radius: 14px; overflow: hidden;
    background: none; display: flex; align-items: center; justify-content: center;
    font-size: 11px; line-height: 1.2; text-align: center; text-shadow: none;
  }
  .icon img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .dock {
    position: absolute; left: 12px; right: 12px; bottom: 14px; height: 92px; border-radius: 30px;
    background: rgba(255,255,255,.25); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    display: flex; justify-content: space-around; align-items: center;
  }

  /* ---------- 카카오톡 ---------- */
  #kakao { z-index: 16; opacity: 0; pointer-events: none; transform: scale(.92); background: #fff; color: #111; display: flex; flex-direction: column; }
  #kakao.show { opacity: 1; pointer-events: auto; transform: none; }
  .khead { flex: none; height: 96px; padding: 50px 18px 0; font-size: 22px; font-weight: 700; }
  .kmain { flex: 1; overflow-y: auto; scrollbar-width: none; }
  .kmain::-webkit-scrollbar, .rbody::-webkit-scrollbar { display: none; }
  .ktabs { flex: none; height: 80px; padding-bottom: 24px; display: flex; border-top: 1px solid #eee; background: #fff; }
  .ktab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; color: #999; opacity: .55; }
  .ktab svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .ktab.on svg { fill: currentColor; }
  .ktab.on { color: #111; opacity: 1; }
  .ktab.act { cursor: pointer; }
  .khome { position: absolute; left: 0; right: 0; bottom: 0; height: 24px; z-index: 6; cursor: pointer; touch-action: none; }
  .khome::after { content: ""; position: absolute; left: 50%; bottom: 8px; width: 130px; height: 5px; margin-left: -65px; border-radius: 3px; background: #111; }
  .av { position: relative; flex: none; overflow: hidden; border-radius: 36%; background: #dfe3e8; color: #777; font-size: 10px; line-height: 1.2; text-align: center; display: flex; align-items: center; justify-content: center; }
  .av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .srow { display: flex; align-items: center; gap: 12px; padding: 10px 18px; }
  .srow b { font-size: 15px; font-weight: 600; }
  .srow.click { cursor: pointer; }
  .sec { padding: 8px 18px; margin-top: 6px; font-size: 12px; color: #888; border-top: 1px solid #f0f0f0; }
  .crow .ct { flex: 1; min-width: 0; }
  .crow .cl { margin-top: 3px; font-size: 13px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crow .tm { align-self: flex-start; padding-top: 4px; font-size: 11px; color: #aaa; }

  #kroom { position: absolute; inset: 0; z-index: 4; background: #b2c7da; display: flex; flex-direction: column; transform: translateX(100%); transition: transform .35s ease; }
  #kroom.show { transform: none; }
  .group-notice { display:none; flex:none; padding:10px 14px; background:#fff; border-bottom:1px solid #e8e8e8; font-size:12px; color:#333; cursor:pointer; line-height:1.4; }
  .group-notice.show { display:flex; gap:8px; align-items:center; }
  .group-notice .pin { color:#777; font-size:15px; }
  .group-notice .notice-text { flex:1; }
  .group-notice .notice-arrow { color:#999; }
  .group-avatar { flex:none; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:1px; overflow:hidden; border-radius:36%; background:#ddd; }
  .group-avatar img { width:100%; height:100%; object-fit:cover; min-width:0; min-height:0; }
  .group-avatar.n3 img:first-child { grid-column: 1 / span 2; }
  .rhead { flex: none; height: 96px; padding: 50px 14px 0; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600; }
  .rhead .back { padding: 0 6px 4px; font-size: 32px; font-weight: 300; line-height: 1; cursor: pointer; }
  .rbody { flex: 1; overflow-y: auto; padding: 6px 12px 12px; scrollbar-width: none; }
  .dsep { text-align: center; margin: 14px 0 8px; }
  .dsep span { display: inline-block; padding: 4px 12px; border-radius: 12px; background: rgba(0,0,0,.2); color: #fff; font-size: 11px; }
  .m { display: flex; gap: 8px; margin: 5px 0; }
  .m.me { justify-content: flex-end; align-items: flex-end; gap: 5px; }
  .mc { min-width: 0; }
  .mn { margin: 0 0 3px 2px; font-size: 12px; color: #333; }
  .mb { display: flex; align-items: flex-end; gap: 5px; }
  .bub { max-width: 230px; padding: 8px 11px; border-radius: 14px; background: #fff; color: #111; font-size: 14px; line-height: 1.4; word-break: break-all; }
  .m.me .bub { background: #fee500; }
  .bub.img-only { padding: 0; background: none !important; }
  /* 음성 메시지 */
  .bub.voice { display: flex; align-items: center; gap: 9px; width: 196px; padding: 8px 12px 8px 8px; cursor: pointer; }
  .voice .vbtn { flex: none; width: 30px; height: 30px; border-radius: 50%; background: #f0f0f0; color: #444; display: flex; align-items: center; justify-content: center; font-size: 11px; padding-left: 1px; }
  .voice .vwave { flex: 1; min-width: 0; height: 24px; display: flex; align-items: center; justify-content: space-between; }
  .voice .vwave i { display: block; width: 3px; border-radius: 2px; background: #cfcfcf; }
  .voice .vwave i.on { background: #6d6d6d; }
  .voice .vdur { flex: none; font-size: 12px; color: #777; font-variant-numeric: tabular-nums; }
  .chat-img { display: block; max-width: 200px; max-height: 260px; border-radius: 14px; object-fit: cover; cursor: zoom-in; }
  .bub.deleted { color: #888; }
  .del-view { margin-top: 7px; padding-top: 7px; border-top: 1px solid #eee; font-size: 12px; color: #4a7cf7; cursor: pointer; }
  .del-orig { margin-top: 7px; padding-top: 7px; border-top: 1px solid #eee; color: #111; }

  /* ---------- 사진 크게 보기 ---------- */
  #viewer {
    position: absolute; inset: 0; z-index: 40;
    background: rgba(0,0,0,.94);
    display: flex; align-items: center; justify-content: center;
    padding: 90px 12px 40px;   /* 위쪽을 비워 둬서 사진이 상태 표시줄을 가리지 않게 */
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
    cursor: zoom-out;
  }
  #viewer.show { opacity: 1; pointer-events: auto; }
  #viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .viewer-x { position: absolute; top: 56px; right: 20px; color: #fff; font-size: 26px; line-height: 1; cursor: pointer; z-index: 2; }
  .m i { font-style: normal; font-size: 10px; color: #4b5b6a; white-space: nowrap; }
  .sp { flex: none; width: 38px; }

  /* 채팅 입력창: 글자가 입력되는 중 + 보내기 버튼 */
  .kin { flex: none; height: 70px; padding: 8px 14px 24px; background: #fff; display: flex; align-items: center; gap: 12px; color: #888; font-size: 20px; }
  .kin .fld {
    flex: 1; height: 34px; border-radius: 17px; background: #f1f1f1;
    display: flex; align-items: center; padding: 0 14px;
    font-size: 14px; color: #111; text-align: left; white-space: nowrap; overflow: hidden;
  }
  .kin .fld.typing::after { content: ""; width: 1.5px; height: 16px; margin-left: 1px; background: #111; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .ksend {
    flex: none; width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: #aaa; background: transparent;
  }
  .ksend.ready { background: #fee500; color: #111; cursor: pointer; }

/* iPhone 스타일 상태 표시줄 */
.status-bar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 54px;
  padding: 0 27px 1px 29px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 50;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  pointer-events: none;
}

.status-time {
  display: block;
  min-width: 48px;
  font-size: 15.5px;
  line-height: 1;
  font-weight: 650;
  letter-spacing: -0.35px;
  font-variant-numeric: tabular-nums;
}

/* 다이내믹 아일랜드 */
.dynamic-island {
  position: absolute;
  top: 7px;
  left: 50%;
  transform: translateX(-50%);
  width: 126px;
  height: 36px;
  background: #000;
  border-radius: 24px;
}

/* 오른쪽 상태 아이콘 */
.status-right {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 5px;
  min-width: 78px;
  height: 18px;
}

.status-right svg {
  display: block;
  flex-shrink: 0;
  overflow: visible;
}

.status-right .signal {
  width: 17px;
  height: 14px;
}

.status-right .wifi {
  width: 16px;
  height: 14px;
}

.status-right .battery {
  width: 26px;
  height: 13px;
  margin-left: 1px;
}

/* 카카오톡 화면에서는 검은색 아이콘 */
.phone:has(#kakao.show) .status-bar {
  color: #111;
}

/* ---------- 알림 배너 ---------- */
  #banner {
    position: absolute;
    z-index: 45;
    left: 10px;
    right: 10px;
    top: 54px;
    padding: 12px 14px;
    min-height: 64px;
    border: 1px solid rgba(255,255,255,.35);
    border-radius: 22px;
    background: rgba(248,248,250,.92);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    backdrop-filter: blur(24px) saturate(180%);
    color: #111;
    display: flex;
    gap: 10px;
    align-items: center;
    cursor: pointer;
    box-shadow: 0 8px 28px rgba(0,0,0,.22);
    transform: translateY(calc(-100% - 70px));
    transition: transform .42s cubic-bezier(.2,.8,.2,1);
  }
  #banner.show { transform: translateY(0); }
  .bicon { position: relative; flex: none; width: 40px; height: 40px; border-radius: 10px; overflow: hidden; background: #fee500; }
  .bicon img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .btxt { flex: 1; min-width: 0; }
  .btop { display: flex; justify-content: space-between; font-size: 12px; color: #666; }
  .bname { margin-top: 1px; font-size: 15px; font-weight: 600; }
  .bbody { font-size: 14px; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }


  /* ===== 친구 프로필 화면 (SVG 이미지도 지원) ===== */
  #kprofile {
    position: absolute; inset: 0; z-index: 5; background: #fff; color: #111;
    display: flex; flex-direction: column; transform: translateX(100%);
    transition: transform .32s ease; overflow: hidden;
  }
  #kprofile.show { transform: translateX(0); }
  .profile-cover { position: relative; flex: 0 0 52%; min-height: 260px; max-height: 470px; background: #d9dce2; overflow: hidden; }
  .profile-cover-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .profile-cover-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #777; font-size: 18px; }
  .profile-close { position: absolute; top: 48px; left: 16px; z-index: 2; border: 0; background: rgba(0,0,0,.3); color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 28px; cursor: pointer; }
  .profile-details { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 0 22px 34px; min-height: 0; }
  .profile-avatar-wrap { margin-top: -42px; z-index: 1; border: 4px solid white; border-radius: 27%; background: #dfe3e8; }
  .profile-avatar-wrap .av { border-radius: 22%; }
  .profile-name { margin-top: 12px; font-size: 21px; font-weight: 650; }
  .profile-status { margin-top: 9px; min-height: 24px; font-size: 13px; color: #777; text-align: center; white-space: pre-wrap; overflow-wrap: anywhere; }
  .profile-actions { display: flex; justify-content: center; gap: 34px; margin-top: auto; padding-top: 24px; }
  .profile-action { border: 0; background: transparent; color: #333; display: flex; flex-direction: column; align-items: center; gap: 7px; font: inherit; font-size: 12px; cursor: pointer; }
  .profile-action-icon { width: 48px; height: 48px; border-radius: 50%; background: #f5f5f5; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .profile-custom-icon {
  width: 24px;
  height: 24px;
  object-fit: contain;
}


  /* ================= 전화 앱 (아이폰 전화 앱 모양) ================= */
  #tel { z-index: 16; opacity: 0; pointer-events: none; transform: scale(.92); background: #fff; color: #000; display: flex; flex-direction: column; }
  #tel.show { opacity: 1; pointer-events: auto; transform: none; }
  .tmain { position: relative; flex: 1; overflow-y: auto; scrollbar-width: none; }
  .tmain::-webkit-scrollbar { display: none; }
  .tnav { flex: none; height: 96px; padding: 50px 16px 0; display: flex; align-items: center; justify-content: space-between; color: #007aff; font-size: 17px; }
  .tnav .plus { font-size: 28px; font-weight: 300; line-height: 1; }
  .ttitle { padding: 2px 16px 6px; font-size: 34px; font-weight: 700; letter-spacing: -.4px; }
  .tsearch { margin: 2px 16px 10px; height: 36px; border-radius: 10px; background: #eeeef0; color: #8e8e93; display: flex; align-items: center; gap: 6px; padding: 0 10px; font-size: 17px; }
  .tsearch svg { width: 16px; height: 16px; fill: none; stroke: #8e8e93; stroke-width: 2.2; stroke-linecap: round; }
  .tmy { display: flex; align-items: center; gap: 12px; padding: 8px 16px 12px; border-bottom: 1px solid #e5e5ea; }
  .tmy b { display: block; font-size: 22px; font-weight: 600; }
  .tmy small { font-size: 13px; color: #8e8e93; }
  .tsec { padding: 2px 16px; font-size: 13px; font-weight: 600; color: #6d6d72; background: #f2f2f7; }
  .trow { display: flex; align-items: center; gap: 12px; padding-left: 16px; cursor: pointer; }
  .trow:active { background: #e5e5ea; }
  .trow .rb { flex: 1; min-width: 0; padding: 12px 16px 12px 0; border-bottom: 1px solid #e5e5ea; font-size: 17px; font-weight: 600; }
  .trow .rb small { display: flex; align-items: center; gap: 4px; margin-top: 2px; font-size: 14px; font-weight: 400; color: #8e8e93; }
  .trow .rb small svg { width: 12px; height: 12px; fill: none; stroke: #8e8e93; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .trow .rt { flex: none; padding-right: 4px; font-size: 15px; color: #8e8e93; }
  .trow .ri { flex: none; padding-right: 16px; color: #007aff; font-size: 20px; }
  .tav { flex: none; overflow: hidden; border-radius: 50%; background: linear-gradient(#b9bcc6, #9a9ea9); display: flex; align-items: flex-end; justify-content: center; }
  .tav svg { width: 74%; height: 74%; fill: #fff; opacity: .92; margin-bottom: -4%; }
  .tidx { position: absolute; right: 3px; top: 190px; bottom: 100px; z-index: 3; display: none; flex-direction: column; justify-content: space-between; align-items: center; font-size: 10px; font-weight: 700; color: #007aff; pointer-events: none; }
  .tempty { padding: 90px 20px; text-align: center; font-size: 20px; font-weight: 600; color: #8e8e93; }
  .tseg { display: flex; padding: 2px; border-radius: 9px; background: #eeeef0; color: #000; font-size: 13px; }
  .tseg b { padding: 5px 18px; border-radius: 7px; font-weight: 500; cursor: pointer; }
  .tseg b.on { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.15); }

  .ttabs { flex: none; height: 80px; padding-bottom: 24px; display: flex; border-top: 1px solid #d1d1d6; background: #f9f9f9; }
  .ttab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10px; color: #8e8e93; cursor: pointer; }
  .ttab svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .ttab.on { color: #007aff; }

  /* 키패드 */
  .kpwrap { display: flex; flex-direction: column; align-items: center; }
  .kpnum { margin-top: 92px; height: 44px; max-width: 340px; font-size: 36px; letter-spacing: .3px; display: flex; align-items: center; white-space: nowrap; overflow: hidden; }
  .kpadd { height: 24px; margin-bottom: 8px; font-size: 15px; color: #007aff; }
  .kpgrid { display: grid; grid-template-columns: repeat(3, 78px); gap: 14px 24px; }
  .tkey { width: 78px; height: 78px; border-radius: 50%; background: #e9e9ed; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
  .tkey:active { background: #c8c8cd; }
  .tkey b { font-size: 34px; font-weight: 400; line-height: 1; }
  .tkey small { height: 12px; margin-top: 1px; font-size: 10px; font-weight: 700; letter-spacing: 2px; }

<script>
  const PASSCODE = '1129';
  const $ = id => document.getElementById(id);

  /* ===== 앱 목록 ===== */
  const apps = [
    { id: 'kakao', n: '카카오톡', p: '카카오톡1', f: 'kakao.png' },
    { id: 'insta', n: 'instagram', p: '인스타그램1', f: 'instagram.webp' },
    { id: 'blog', n: '블로그', p: '블로그', f: 'blog.png' }
  ];

  const dockApps = [
    { id: 'phone', n: '전화', p: '전화1', f: 'call.webp' },
    { n: '문자', p: '문자1', f: 'message.webp' },
    { n: '네이버', p: '네이버1', f: 'naver.svg' },
    { n: '음악', p: '음악1', f: 'music.webp' }
  ];

  function appHTML(a, showName) {
    return `<div class="app" data-id="${a.id || ''}"><div class="icon"><span>${a.p}</span>` +
      `<img src="${a.f}" alt="" onload="this.previousSibling.remove()" onerror="this.remove()"></div>${showName ? a.n : ''}</div>`;
  }

  $('grid').innerHTML = apps.map(a => appHTML(a, true)).join('');
  $('dock').innerHTML = dockApps.map(a => appHTML(a, false)).join('');

  /* ===== 시계 ===== */
  function tick() {
    const now = new Date();

    const currentTime = now.toLocaleTimeString('ko-KR', {
      hour: '2-digit',
      minute: '2-digit',
      hour12: false
    });

    $('time').textContent = currentTime;
    $('statusTime').textContent = currentTime;

    $('date').textContent = now.toLocaleDateString('ko-KR', {
      month: 'long',
      day: 'numeric',
      weekday: 'long'
    });
  }

  tick();
  setInterval(tick, 1000);

  /* ===== 아래에서 위로 밀어 올리기 ===== */
  const lock = $('lock'), pass = $('pass'), home = $('home');
  let startY = null;

  function openPass() {
    lock.style.transform = 'translateY(-100%)';
    pass.style.opacity = 1;
    pass.classList.add('active');
  }

  function closePass() {
    lock.style.transform = '';
    pass.style.opacity = 0;
    pass.classList.remove('active');
    entry = '';
    renderDots();
  }

  lock.addEventListener('pointerdown', e => {
    startY = e.clientY;
    lock.classList.add('drag');
    pass.classList.add('drag');
  });

  window.addEventListener('pointermove', e => {
    if (startY === null) return;
    const dy = Math.min(0, e.clientY - startY);
    lock.style.transform = `translateY(${dy}px)`;
    pass.style.opacity = Math.min(1, -dy / 250);
  });

  window.addEventListener('pointerup', e => {
    if (startY === null) return;
    const dy = e.clientY - startY;
    startY = null;
    lock.classList.remove('drag');
    pass.classList.remove('drag');
    if (dy < -80) openPass();
    else closePass();
  });

  $('hint').addEventListener('click', openPass);

  /* ===== 암호 입력 ===== */
  let entry = '';
  const keysEl = $('keys');

  ['1','2','3','4','5','6','7','8','9','emergency','0','cancel'].forEach(k => {
    const b = document.createElement('button');
    b.className = 'key' + (k === 'emergency' ? ' emergency' : k === 'cancel' ? ' text' : '');
    b.textContent = k === 'cancel' ? '취소' : k === 'emergency' ? '긴급 상황' : k;
    if (k === 'cancel') b.id = 'cancel';
    if (k !== 'emergency') b.addEventListener('click', () => press(k));
    keysEl.appendChild(b);
  });

  function renderDots() {
    [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i < entry.length));
    $('cancel').textContent = entry ? '삭제' : '취소';
  }

  function press(k) {
    if (k === 'cancel') {
      if (entry) {
        entry = entry.slice(0, -1);
        renderDots();
      } else {
        closePass();
      }
      return;
    }

    if (k === '' || entry.length >= 4) return;
    entry += k;
    renderDots();

    if (entry.length === 4) setTimeout(check, 150);
  }

  function check() {
    if (entry === PASSCODE) {
      pass.style.opacity = 0;
      pass.classList.remove('active');
      home.classList.add('show');
      /* 잠금화면에서 알림을 눌렀다면 해당 알림의 앱으로 이동 */
      if (evOpenStoryAfterUnlock) {
        evOpenStoryAfterUnlock = false;
        setTimeout(openMyungStoryFromBanner, 350);
      } else if (evOpenBlogAfterUnlock) {
        evOpenBlogAfterUnlock = false;
        setTimeout(openBlogRequest, 350);
      } else if (evOpenAfterUnlock) {
        evOpenAfterUnlock = false;
        setTimeout(goEventRoom, 350);
      }
    } else {
      $('dots').classList.add('shake');
      setTimeout(() => {
        $('dots').classList.remove('shake');
        entry = '';
        renderDots();
      }, 400);
    }
  }

  /* ===== 카카오톡 대화 내용 ===== */
  const me = { name: '문하나', ph: '내 프로필 사진', f: 'hanaprofile.jpg' };
  const friend = { name: '김운학', ph: '프로필 사진1', f: 'Woonhak.jpeg' };

  const friendList = [
    { ...friend, bg: 'graybg.jpg', status: 'Carpe diem' },
    { name: '명재현', ph: '프로필 사진2', f: 'myung.jpeg', bg: 'jhbg.jpg', status: 'ONU 24' },
    { name: '우지호', ph: '프로필 사진3', f: 'zico.jpeg', bg: 'graybg.jpg', status: '😴' },
    { name: '시준휘', ph: '프로필 사진3', f: '127.jpeg', bg: 'graybg.jpg', status: '자유로운 우리를 봐 자유로워' },
    { name: '부희주', ph: '프로필 사진4', f: 'RIIZE.jpg', bg: 'graybg.jpg', status: '렛츠끼끼' },
    { name: '정사이', ph: '프로필 사진5', f: 'TWS.jpeg', bg: 'graybg.jpg', status: 'Hot  hot 뜨거 뜨거' },
  ];

  /* ===== 4인 단체 채팅방: 이름/공지/첫 메시지는 자유롭게 수정하세요 ===== */
  const groupMembers = [
    { name: '문하나', f: me.f, ph: me.ph, me: true },
    friendList.find(x => x.name === '시준휘'),
    friendList.find(x => x.name === '부희주'),
    friendList.find(x => x.name === '정사이')
  ];
  const groupChat = {

  /* ===== 음성 메시지 (m.audio = 'um.mp3' 처럼 같은 폴더의 소리 파일) ===== */
  const VOICE_BARS = [6,10,16,9,14,20,12,8,16,22,14,9,12,18,10,7,14,19,11,8,13,17,9,6];
  const voiceDur = {};
  let voiceAudio = null, voiceSrc = null;
  const fmtDur = sec => { sec = Math.round(sec); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); };

  function voiceHTML(src) {
    return `<div class="bub voice" data-src="${src}"><span class="vbtn">▶</span>` +
      `<span class="vwave">${VOICE_BARS.map(h => `<i style="height:${h}px"></i>`).join('')}</span>` +
      `<span class="vdur">${voiceDur[src] != null ? fmtDur(voiceDur[src]) : '0:00'}</span></div>`;
  }

  /* 화면에 있는 음성 메시지들의 재생 버튼 · 진행 모양 · 시간 갱신 */
  function syncVoiceUI() {
    document.querySelectorAll('.voice').forEach(el => {
      const src = el.dataset.src;
      const cur = voiceAudio && voiceSrc === src;
      const playing = cur && !voiceAudio.paused;
      const t = cur ? voiceAudio.currentTime : 0;
      const prog = cur && voiceAudio.duration ? t / voiceAudio.duration : 0;
      const d = voiceDur[src];
      el.querySelector('.vbtn').textContent = playing ? '❚❚' : '▶';
      el.querySelectorAll('.vwave i').forEach((b, i, all) => b.classList.toggle('on', i < Math.round(prog * all.length)));
      el.querySelector('.vdur').textContent = d != null ? fmtDur(playing ? Math.max(0, d - t) : d) : '0:00';
    });
  }

  function loadVoiceDur(src) {
    if (voiceDur[src] != null) return;
    const a = new Audio();
    a.preload = 'metadata';
    a.onloadedmetadata = () => { if (isFinite(a.duration)) { voiceDur[src] = a.duration; syncVoiceUI(); } };
    a.src = src;
  }

  function toggleVoice(src) {
    if (voiceAudio && voiceSrc === src) {
      if (voiceAudio.paused) voiceAudio.play().catch(() => {});
      else voiceAudio.pause();
      syncVoiceUI();
      return;
    }
    stopVoice();
    voiceAudio = new Audio(src);
    voiceSrc = src;
    ['timeupdate', 'play', 'pause'].forEach(ev => voiceAudio.addEventListener(ev, syncVoiceUI));
    voiceAudio.addEventListener('ended', () => { voiceAudio.currentTime = 0; syncVoiceUI(); });
    voiceAudio.play().catch(() => {});
    syncVoiceUI();

    comment: '<svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-12.2 7.5L3 20.5l1.6-5A8.4 8.4 0 1 1 21 11.5z"/></svg>',
    share:   '<svg viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4M5 12v7h14v-7"/></svg>',
    mark:    '<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.8L6 21V3z"/></svg>',
    feed:    '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h4"/></svg>',
    bell:    '<svg viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15l1.5-2z"/><path d="M10 21.5h4"/></svg>'
  };

  function blogAvatar(name, file) {
    return `<div class="nb-avatar">${file ? `<img src="${file}" onerror="this.remove()">` : name}</div>`;
  }

  function blogPostHTML(post) {
    return `<article class="nb-card">
      <div class="nb-author">${blogAvatar('김운학','Woonhak.jpeg')}
        <div class="nb-author-info"><b>김운학</b><small>${post.date} · ${post.category}</small></div>
        <span class="nb-badge">서로이웃</span></div>
      <h3>${post.title}</h3>
      <p>${post.text}</p>
      <div class="nb-thumb">${post.image ? `<img src="${post.image}" onerror="this.parentNode.textContent='${post.image}'">` : '사진을 넣어주세요'}</div>
      <div class="nb-acts"><span>${NB.heart}공감</span><span>${NB.comment}댓글</span><span>${NB.share}</span><span class="r">${NB.mark}</span></div>
    </article>`;
  }

  /* 서로이웃 수락 (알림 배너 · 알림 탭 · 신청 화면 어디서든 이 함수를 써요) */
  function acceptBlogNeighbor() {
    blogAccepted = true;
    blogRequestPage = false;
    hideBanner();
    renderBlog();
  }

  function renderBlog() {
    const main = $('nbMain');
    const seg = `<div class="nb-seg">
      <div data-nbquick="home" class="${blogTab === 'home' ? 'on' : ''}">추천</div>
      <div data-nbquick="neighbors" class="${blogTab === 'neighbors' ? 'on' : ''}">이웃 새글</div></div>`;
    const feed = blogAccepted
      ? woonhakBlogPosts.map(blogPostHTML).join('')
      : `<div class="nb-empty"><div class="nb-empty-icon">${NB.feed}</div><div>아직 이웃의 새 글이 없어요</div></div>`;

    if (blogRequestPage) {
      main.innerHTML = `<div class="nb-title">서로이웃 신청</div>
        <div class="nb-request">${blogAvatar('김운학','Woonhak.jpeg')}
          <b>김운학</b><p>서로이웃을 신청했어요</p>
          <button class="nb-accept" id="nbAccept">수락하기</button></div>`;
      $('nbAccept').addEventListener('click', acceptBlogNeighbor);
    } else if (blogTab === 'mine') {
      main.innerHTML = `<div class="nb-title">MY</div>
        <div class="nb-profile">${blogAvatar('문하나','hanaprofile.jpg')}
          <div><b>문하나</b><small>내 블로그</small></div></div>
        <div class="nb-empty" style="min-height:200px"><div>아직 작성한 글이 없어요</div></div>`;
    } else if (blogTab === 'write') {
      main.innerHTML = `<div class="nb-title">글쓰기</div>
        <div class="nb-empty"><div>오늘의 이야기를 기록해 보세요</div></div>`;
    } else if (blogTab === 'notice') {
      main.innerHTML = `<div class="nb-title">알림</div>` + (blogRequestReceived
        ? `<div class="nb-notice-card"><span class="nb-notice-dot"></span>
             <div class="nb-notice-txt"><b>김운학</b>님이 서로이웃을 신청했어요<small>방금 전</small></div>
             ${blogAccepted ? '<span class="nb-done">이웃</span>' : '<button class="nb-mini" id="nbAcceptMini">수락</button>'}</div>`
        : `<div class="nb-empty"><div class="nb-empty-icon">${NB.bell}</div><div>새로운 알림이 없어요</div></div>`);
      const mini = $('nbAcceptMini');
      if (mini) mini.addEventListener('click', acceptBlogNeighbor);
    } else {
      main.innerHTML = seg + feed;
    }

    $('nbTabs').querySelectorAll('.nb-tab').forEach(el => {
      el.classList.toggle('on', !blogRequestPage && el.dataset.nbtab === blogTab);
      if (el.dataset.nbtab === 'notice') el.classList.toggle('has', blogRequestReceived && !blogAccepted);
    });
    main.querySelectorAll('[data-nbquick]').forEach(el => el.addEventListener('click', () => {
      blogTab = el.dataset.nbquick;
      renderBlog();
    }));
  }

  function openBlog() {
    blogRequestPage = false;
    blogTab = 'home';
    $('blog').classList.add('show');
    renderBlog();
  }

  function openBlogRequest() {
    hideBanner();
    if (!home.classList.contains('show')) {
      evOpenBlogAfterUnlock = true;
      openPass();
      return;
    }
    kakao.classList.remove('show');
    room.classList.remove('show');
    insta.classList.remove('show');
    $('blog').classList.remove('show');
    $('idm').classList.remove('show');
    $('idmroom').classList.remove('show');
    closeStory(); closeTel(); closeViewer(); closeProfiles();
    $('kprofile').classList.remove('show');
    home.classList.remove('show');
    $('blog').classList.add('show');
    blogRequestPage = false;
    blogTab = 'notice';
    renderBlog();
  }

  $('nbTabs').addEventListener('click', e => {
    const tabEl = e.target.closest('.nb-tab');
    if (!tabEl) return;
    blogRequestPage = false;
    blogTab = tabEl.dataset.nbtab;
    renderBlog();
  });

  let nbHomeStart = null;
  $('nbHome').addEventListener('pointerdown', e => { nbHomeStart = e.clientY; });
  $('nbHome').addEventListener('pointerup', e => {
    if (nbHomeStart === null) return;
    const dy = e.clientY - nbHomeStart;
    nbHomeStart = null;
    if (Math.abs(dy) < 25 || dy < -30) returnToPhoneHome();
  });
  $('nbHome').addEventListener('pointercancel', () => { nbHomeStart = null; });

  function showBlogRequestBanner() {
    clearTimeout(evBannerTimer);
    clearInterval(evBannerTimer);
    bannerAfterHide = null;
    bannerTargetName = '김운학';
    bannerTargetType = 'blog';
    $('banner').innerHTML =
      `<div class="bicon" style="background:#fff;color:#03c75a;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900">N</div>` +
      `<div class="btxt"><div class="btop"><span>네이버 블로그</span><span>지금</span></div>` +
      `<div class="bname">김운학</div><div class="bbody">🟢김운학 님이 서로이웃을 신청했습니다</div></div>`;
    $('banner').classList.add('show');
    evBannerTimer = setTimeout(hideBanner, 8000);
  }

  const BLOG_OK = '그래 좋아';
  let blogOkPending = false;

  function evWoonBlog27Arrive() {
    const day = { date:'11월 27일 금요일', msgs:[] };
    chats[EV_NAME].push(day);
    evWoonDay2 = day;
    const push27 = (me, t) => {
      day.msgs.push({ me, t, time:nowHM() });
      if (evIsWoonhakRoom()) renderDirect();
      if (kakao.classList.contains('show') && tab === 'chat' && !room.classList.contains('show')) showTab('chat');
    };

    push27(false, '누나 저 블로그 해요');
    showKakaoBanner(EV_NAME, '누나 저 블로그 해요');
    evTimers.push(setTimeout(() => {
      push27(false, '서이추해요');
      showKakaoBanner(EV_NAME, '서이추해요');
      // 이제 '그래 좋아'는 내가 직접 보내요 (채팅방에 있으면 바로 입력창에 타이핑됨)
      blogOkPending = true;
      if (evIsWoonhakRoom() && evWoonStep < 0) typeInput(BLOG_OK, evSendBlogOk);
    }, 2000));
  }

  /* ➤ 를 누르면 '그래 좋아' 전송 → 2초 뒤 블로그 서로이웃 알림 */
  function evSendBlogOk() {
    blogOkPending = false;
    evWoonDay2.msgs.push({ me:true, t:BLOG_OK, time:nowHM() });
    if (evIsWoonhakRoom()) renderDirect();
    evTimers.push(setTimeout(() => {
      blogRequestReceived = true;
      showBlogRequestBanner();
    }, 2000));
  }


  const evIsWoonhakRoom = () =>
    room.classList.contains('show') && activeFriend && !activeFriend.isGroup && activeFriend.name === EV_NAME;

  const evIsMyungRoom = () =>
    room.classList.contains('show') && activeFriend && !activeFriend.isGroup && activeFriend.name === '명재현';

  /* ----- 입력창 타이핑 + 보내기 버튼 ----- */
  const kfld = $('kfld'), ksend = $('ksend');
  let typeStartT = null, typeTimer = null, sendAction = null;

  function clearInput() {
    clearTimeout(typeStartT);
    clearInterval(typeTimer);
    kfld.textContent = '';
    kfld.classList.remove('typing');
    ksend.classList.remove('ready');
    sendAction = null;
  }

  function typeInput(text, action) {
    clearInput();
    typeStartT = setTimeout(() => {
      let i = 0;
      kfld.classList.add('typing');
      typeTimer = setInterval(() => {
        i++;
        kfld.textContent = text.slice(0, i);
        if (i >= text.length) {
          clearInterval(typeTimer);
          kfld.classList.remove('typing');
          ksend.classList.add('ready');   // 이제 ➤ 를 누를 수 있어요
          sendAction = action;
        }
      }, EV_TYPE_MS);
    }, 700);
  }

  ksend.addEventListener('click', () => {
    if (!sendAction) return;
    const act = sendAction;
    clearInput();
    act();
  });

  /* 메시지 하나 추가 후 방이 열려 있으면 다시 그리기 */
  function evPush(m) {
    // 이벤트 메시지는 발신자에 맞는 채팅 기록에 추가합니다.
    const targetName = m._target || EV_NAME;
    const targetDay = m._day || (targetName === '명재현' ? evMyungDay : evDay);
    if (!targetDay) return;
    const cleanMessage = { ...m };
    delete cleanMessage._target;
    delete cleanMessage._day;
    targetDay.msgs.push(cleanMessage);
    if ((targetName === EV_NAME && evIsWoonhakRoom()) ||
        (targetName === '명재현' && evIsMyungRoom())) renderDirect();
    if (kakao.classList.contains('show') && tab === 'chat' && !room.classList.contains('show')) showTab('chat');
  }

  /* 채팅방이 열릴 때: 지금 단계에 맞는 글자를 입력창에 타이핑 */
  function evAfterOpen() {
    clearInput();
    if (!evIsWoonhakRoom() && !evIsMyungRoom()) return;
    if (evStage === 1 && evIsWoonhakRoom()) typeInput(EV_MY_ASK.t, evSendAsk);
    else if (evStage === 3 && evIsWoonhakRoom()) typeInput(EV_MY_OK.t, evSendOk);
    else if (evStage === 5 && evIsMyungRoom()) typeInput('뭔소리야', evSendMyungReply1);
    else if (evStage === 7 && evIsMyungRoom()) typeInput('취객 주우러 갈게', evSendMyungReply2);
    /* 11월 16일 김운학 대화 */
    else if (evStage === 10 && evIsWoonhakRoom()) evWoonType();
    else if (blogOkPending && evWoonStep < 0 && evIsWoonhakRoom()) typeInput(BLOG_OK, evSendBlogOk);
  }

  /* 내가 '삭제된 메시지 뭐야?' 전송 → 2초 뒤 답장 하나씩 */
  function evSendAsk() {
    evStage = 2;
    evPush({ ...EV_MY_ASK });
    EV_REPLIES.forEach((r, i) => {
      evTimers.push(setTimeout(() => {
        evPush({ ...r });
        if (i === EV_REPLIES.length - 1) {
          evStage = 3;
          if (evIsWoonhakRoom()) typeInput(EV_MY_OK.t, evSendOk);
        }
      }, EV_REPLY_GAP_MS * (i + 1)));
    });
  }

  /* 내가 '오키' 전송 */
  function evSendOk() {
    evStage = 4;
    evPush({ ...EV_MY_OK });
    // 문하나가 '오키'를 보낸 시점부터 1분을 계산합니다.
    evTimers.push(setTimeout(evMyungArrive, EV_MJ_DELAY_MS));
  }

  /* 명재현과의 대화: 답장을 보내면 2초 뒤 다음 메시지가 도착합니다. */
  function evSendMyungReply1() {
    evStage = 6;
    evPush({ me: true, t: '뭔소리야', time: nowHM(), _target: '명재현' });

    /* 2초 간격으로: 글 → 글 → 음성 메시지 */
    const seq = [
      () => evPush({ me: false, t: '얘 지금 대박포차에서 맥주 3입 마시더니', time: nowHM(), _target: '명재현' }),
      () => evPush({ me: false, t: '우는데??', time: nowHM(), _target: '명재현' }),
      () => {
        evPush({ me: false, audio: 'um.mp3', time: nowHM(), _target: '명재현' });   // 같은 폴더의 um.mp3
        evStage = 7;
        if (evIsMyungRoom()) typeInput('취객 주우러 갈게', evSendMyungReply2);
      }
    ];
    seq.forEach((fn, i) => evTimers.push(setTimeout(() => {
      if (!evMyungDay) return;
      fn();
    }, EV_REPLY_GAP_MS * (i + 1))));
  }

  function evSendMyungReply2() {
    evStage = 8;
    evPush({ me: true, t: '취객 주우러 갈게', time: nowHM(), _target: '명재현' });
    evTimers.push(setTimeout(() => {
      if (!evMyungDay) return;
      evPush({ me: false, t: '제발 데려가', time: nowHM(), _target: '명재현' });
      evStage = 9;
      evAddMyungStory();   // 알림을 누르지 않아도 인스타 스토리에는 이미 올라가 있어요
      evTimers.push(setTimeout(showInstagramStoryBanner, 1500));
    }, EV_REPLY_GAP_MS));
  }

  /* 명재현의 스토리에 jip.mp4 추가 (이미 있는 스토리 뒤에 이어 붙이고, 안 본 상태로 되돌려요) */
  function evAddMyungStory() {
    const slide = { f: 'jip.mp4', video: true, ph: '', time: '방금' };
    const st = igStories.find(x => x.u === 1);
    if (st) {
      if (!st.slides.some(x => x.f === slide.f)) {
        st.firstNew = st.slides.length;   // 열면 새로 올라온 영상부터 보여줘요
        st.slides.push(slide);
      }
      st.seen = false;
    } else {
      igStories.push({ u: 1, seen: false, slides: [slide] });
    }
    renderStories();
  }

  /* =====================================================
     ★★★ 11월 16일 월요일 · 김운학 대화 이벤트 ★★★
     명재현의 새 스토리(jip.mp4)를 본 1분 뒤에 시작해요.
     내가 보내는 말(입력창에 타이핑되는 글)은 아래 W_ME 에서 고치세요.
     ===================================================== */
  const W_DATE = '11월 16일 월요일';
  const W_FIRST = '누나 저 어제 집에 어떻게 들어왔죠...?';

  /* 내가 보내는 말 (입력창에 타이핑되는 글). r1a, r1b 처럼 나눠 적은 건 따로따로 전송돼요. */
  const W_ME = {
    r1a: '내가 180넘는 거구의 남자를',
    r1b: '30분 동안 업고 갔지',
    r2a: '편의점 과자 코너에서 ',
    r2b: '여기서부터 저기까지 다 주세요',
    r2c: '말한 거 말곤 없어',
    r3a: '숙취해소스틱 맛있다고',
    r3b: '박스째로 먹으려던 거 겨우 말림',
    r4:  '너 11/28에 뭐해?',
    r5:  '그때 사줘'
  };

  /* 대화 순서표: me = 내가 보낼 말, reply = 그걸 보내면 2초 간격으로 오는 김운학의 말
     ★ 말을 더 나누고 싶으면 { me: W_ME.r1c } 처럼 한 줄만 끼워 넣으면 돼요.
     ★ reply 가 없으면 바로 다음 내 말이 이어서 타이핑돼요. */
  const W_FLOW = [
    { me: W_ME.r1a },
    { me: W_ME.r1b, reply: ['누나 무거웠을 텐데 미안해요 ㅠㅠㅠ', '혹시 저 실수한 거 없었어요?'] },
    { me: W_ME.r2a },
    { me: W_ME.r2b },
    { me: W_ME.r2c, reply: ['🤦🏻‍♂️.. 그거 말곤 없죠..???'] },
    { me: W_ME.r3a },
    { me: W_ME.r3b, reply: ['누나... 제발 밥 살게요'] },
    { me: W_ME.r4,  reply: ['아무것도 없어요!!'] },
    { me: W_ME.r5,  reply: ['넵!!'] }
  ];
  let evWoonStep = -1;      // 지금 타이핑될 차례인 순서표 번호 (-1 = 답장 기다리는 중/끝)
  let evFlowSteps = [];     // 지금 진행 중인 순서표 (W_FLOW 또는 W2_FLOW)
  let evFlowEnd = null;     // 순서표가 끝나면 할 일

  const evWoonPush = m => evPush({ ...m, time: nowHM(), _target: EV_NAME, _day: evWoonDay2 });
  const evWoonLater = (n, fn) => {
    const d = evWoonDay2;
    evTimers.push(setTimeout(() => { if (evWoonDay2 === d) fn(); }, EV_REPLY_GAP_MS * n));
  };

  /* 새 대화(순서표) 시작 */
  function evFlowStart(day, steps, onEnd) {
    evWoonDay2 = day;
    evFlowSteps = steps;
    evFlowEnd = onEnd || null;
    evWoonStep = 0;
    evStage = 10;
    chats[EV_NAME].push(day);
  }

  /* 내 차례의 글을 (김운학 방에 있다면) 입력창에 타이핑 */
  function evWoonType() {
    const i = evWoonStep;
    if (i < 0 || !evFlowSteps[i] || !evIsWoonhakRoom()) return;
    typeInput(evFlowSteps[i].me, () => evWoonSend(i));
  }

  /* 내 말 전송 → 김운학 답장(있으면) → 다음 내 말 */
  function evWoonSend(i) {
    const step = evFlowSteps[i];
    const replies = step.reply || [];
    evWoonStep = -1;
    evWoonPush({ me: true, t: step.me });

    // 11월 26일 대화에서 내가 '당연하지'를 전송하면 아이폰 배경화면을 운학 사진으로 변경해요.
    if (step.me === W2_ME.r3) {
      $('phone').style.backgroundImage = "url('woonhak_wallpaper.jpeg')";
    }

    replies.forEach((t, k) => evWoonLater(k + 1, () => {
      evWoonPush({ me: false, t });
      if (step.me === W2_ME.r2 && t === '고마워요' && !blogEventStarted) {
        blogEventStarted = true;
        evTimers.push(setTimeout(evWoonBlog27Arrive, waitMs(30000)));
      }
    }));
    evWoonLater(replies.length, () => {
      if (i + 1 < evFlowSteps.length) { evWoonStep = i + 1; evWoonType(); }
      else {
        evStage = 11;
        if (evFlowEnd) evFlowEnd();
        if (blogOkPending && evIsWoonhakRoom()) typeInput(BLOG_OK, evSendBlogOk);
      }   // 끝
    });
  }

  /* 김운학 새 메시지가 왔을 때: 화면 갱신 + 카톡 알림 */
  function evFlowShow(bannerText) {
    if (evIsWoonhakRoom()) {
      renderDirect();
      evWoonType();
    } else if (kakao.classList.contains('show') && tab === 'chat' && !room.classList.contains('show')) {
      showTab('chat');
    }
    showKakaoBanner(EV_NAME, bannerText);
  }

  /* 명재현 스토리를 본 1분 뒤: 김운학 카톡 + 알림 (11월 16일) */
  function evWoonArrive() {
    evFlowStart(
      { date: W_DATE, msgs: [{ me: false, t: W_FIRST, time: nowHM() }] },
      W_FLOW,
      /* 마지막 '넵!!' 이 오고 1분 뒤 → 명재현 스토리 알림 */
      () => evTimers.push(setTimeout(evHansuArrive, EV_HANSU_DELAY_MS))

  const igi = {
    heart:   svg(`<path d="${HEART}"/>`),
    comment: svg('<path d="M21 11.5a8.4 8.4 0 0 1-12.2 7.5L3 20.5l1.6-5A8.4 8.4 0 1 1 21 11.5z"/>'),
    share:   svg('<path d="M22 3 10.5 14"/><path d="M22 3l-7 18-4.5-7L3.5 9.5 22 3z"/>'),
    save:    svg('<path d="M6 3h12v18l-6-4.8L6 21V3z"/>'),
    plus:    svg('<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/>'),
    home:    svg('<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3V10.5z"/>'),
    reels:   svg('<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M3 8.5h18M9 3l3 5.5M15 3l3 5.5"/><path d="M10.5 12.5v5l4.2-2.5-4.2-2.5z"/>'),
    search:  svg('<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>'),
    video:   svg('<rect x="3" y="6" width="13" height="12" rx="3"/><path d="m16 10 5-3v10l-5-3"/>'),
    edit:    svg('<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/>'),
    cam:     svg('<path d="M4 8h3l1.5-2h7L17 8h3v11H4V8z"/><circle cx="12" cy="13" r="3.5"/>')
  };
  const igAv = (u, size) => `<div class="round">${avatar(u, size)}</div>`;
  const igPrev = m => m.img ? '사진을 보냈습니다.' : m.t;
  // DM 데이터가 비어 있어도 인스타그램 화면 전체가 실행되도록 기본 객체를 둡니다.
  const igDMs = {};
  const igLast = u => {
    const log = igDMs[u.handle] || [];
    if (!log.length) return null;
    const d = log[log.length - 1];
    return d.msgs[d.msgs.length - 1];
  };

  /* 상단 · 하단 바 (눌러지는 건 DM 탭 하나뿐) */
  $('iicons').innerHTML = igi.plus + igi.heart;
  $('itabs').innerHTML =
    `<div class="itab on act" data-tab="home">${igi.home}</div>` +
    `<div class="itab">${igi.reels}</div>` +
    `<div class="itab">${igi.share}<span class="badge">2</span></div>` +
    `<div class="itab">${igi.search}</div>` +
    `<div class="itab act" data-tab="me">${igAv(igMe, 26)}</div>`;
  $('dmicons').innerHTML = igi.video + igi.edit;
  $('dricons').innerHTML = igi.video + '<span>ⓘ</span>';
  $('dmcam').innerHTML = igi.cam;
  $('dmtitle').textContent = igMe.handle;

  /* ----- 스토리 목록 (내 스토리가 있으면 눌러지고 색깔 테두리가 생겨요) ----- */
  function renderStories() {
    const mineIdx = igStories.findIndex(s => s.mine);
    const has = mineIdx >= 0;
    const mineSeen = has && igStories[mineIdx].seen;

    $('istories').innerHTML =
      `<div class="story mine${has ? ' act' : ''}${mineSeen ? ' seen' : ''}"${has ? ` data-i="${mineIdx}"` : ''}>` +
        `<div class="ring"><div class="in">${igAv(igMe, 56)}</div><span class="plus">+</span></div>` +
        `<div class="nm">내 스토리</div></div>` +
      igStories.map((s, i) => s.mine ? '' :
        `<div class="story act${s.seen ? ' seen' : ''}" data-i="${i}"><div class="ring"><div class="in">${igAv(igUsers[s.u], 56)}</div></div>` +
        `<div class="nm">${igUsers[s.u].handle}</div></div>`
      ).join('');
  }
  renderStories();

  /* ----- 피드 ----- */
  function renderFeed() {
    $('ifeed').innerHTML = igPosts.map((p, i) => {
      const u = igUsers[p.u];
      return `<div class="post" id="post${i}">` +
        `<div class="phead" data-h="${u.handle}">${igAv(u, 32)}<b>${u.handle}</b><span class="more">⋯</span></div>` +
        `<div class="post-img" data-i="${i}"><span>${p.ph}</span><img src="${p.f}" alt="" onload="this.previousSibling.remove()" onerror="this.remove()"></div>` +
        `<div class="pact"><span class="lk-btn${p.liked ? ' on' : ''}" data-i="${i}">${igi.heart}</span>${igi.comment}${igi.share}<span class="sp2">${igi.save}</span></div>` +
        `<div class="pinfo"><div class="lk-n">좋아요 ${p.likes.toLocaleString('ko-KR')}개</div>` +
        `<div><b>${u.handle}</b> ${p.caption}</div>` +
        `<div class="cm">댓글 ${p.comments}개 모두 보기</div><div class="tt">${p.time}</div></div></div>`;
    }).join('');
  }
  renderFeed();

  function setLike(i, on, pop) {
    const p = igPosts[i];
    if (p.liked !== on) {
      p.liked = on;
      p.likes += on ? 1 : -1;
    }
    const el = $('post' + i);
    const btn = el.querySelector('.lk-btn');
    btn.classList.toggle('on', p.liked);
    el.querySelector('.lk-n').textContent = `좋아요 ${p.likes.toLocaleString('ko-KR')}개`;
    if (pop && on) {
      btn.classList.remove('pop');
      void btn.offsetWidth;
      btn.classList.add('pop');
    }
  }

  function bigHeart(media) {
    media.insertAdjacentHTML('beforeend', `<svg class="bigheart" viewBox="0 0 24 24"><path d="${HEART}"/></svg>`);
    const h = media.lastElementChild;
    h.addEventListener('animationend', () => h.remove());
  }

  $('ifeed').addEventListener('click', e => {
    /* 하트 버튼: 좋아요 켜기/끄기 */
    const lk = e.target.closest('.lk-btn');
    if (lk) {
      const i = Number(lk.dataset.i);
      setLike(i, !igPosts[i].liked, true);
      return;
    }
    /* 사진 두 번 탭: 좋아요 */
    const media = e.target.closest('.post-img');
    if (media) {
      const now = Date.now();
      if (now - Number(media.dataset.t || 0) < 350) {
        setLike(Number(media.dataset.i), true, true);
        bigHeart(media);
        media.dataset.t = 0;
      } else {
        media.dataset.t = now;
      }
    }
  });

  /* ----- 스토리 보기 ----- */
  let sIdx = 0, sSlide = 0, sTimer = null;
  let storyList = igStories;   // 지금 보고 있는 스토리 묶음 (하이라이트를 열면 잠깐 바뀌어요)
  const STORY_MS = 5000;
  const STORY_VIDEO_MS = 15000; // 영상 스토리는 15초 동안 표시
  const TAG_ICON = '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.7 3.1-6 7-6s7 2.3 7 6z"/></svg>';

  function openStory(i) {
    storyList = igStories;
    sIdx = i;
    sSlide = (!igStories[i].seen && igStories[i].firstNew) || 0;
    $('story').classList.add('show');
    renderStory();
  }

  function renderStory() {
    const s = storyList[sIdx], u = igUsers[s.u], slides = s.slides;
    const sl = slides[sSlide];

    /* 명재현의 새 스토리(jip.mp4)를 보면 1분 뒤 김운학에게 카톡이 와요 */
    if (sl.f === 'jip.mp4' && !evWoonTriggered && evStage >= 9) {
      evWoonTriggered = true;
      evTimers.push(setTimeout(evWoonArrive, EV_WOON_DELAY_MS));
    }

    /* 명재현의 hansu.jpg 스토리를 보면 30초 뒤 김운학에게 카톡이 와요 */
    if (sl.f === 'hansu.jpg' && !evWoon2Triggered && evStage >= 12) {
      evWoon2Triggered = true;
      evTimers.push(setTimeout(evWoon2Arrive, EV_WOON2_DELAY_MS));
    }

    s.seen = true;
    if (storyList === igStories) {
      const el = document.querySelector(`.story.act[data-i="${sIdx}"]`);
      if (el) el.classList.add('seen');
      document.querySelectorAll(`.pavring[data-si="${sIdx}"]`).forEach(r => r.classList.add('seen'));
    }

    /* 시간은 사진마다 따로 (사진에 time이 없으면 스토리 전체 time 사용) */
    const when = sl.time || s.time || '';
    /* 태그: 이름 아래에 @아이디 로 표시 */
    const tagHTML = sl.tags && sl.tags.length
      ? `<div class="stag">${TAG_ICON}<span>${sl.tags.map(t => '@' + t).join(', ')}</span></div>`
      : '';

    $('sbars').innerHTML = slides.map((_, k) => `<span><b class="${k < sSlide ? 'done' : ''}"></b></span>`).join('');
    $('shead').innerHTML = `${igAv(u, 32)}<div class="sinfo"><div class="sline"><b>${u.handle}</b><span class="tm">${when}</span></div>${tagHTML}</div>`;
    const isVideo = sl.video || /\\.mp4(?:$|[?#])/i.test(sl.f || '');
    const slideDuration = isVideo ? STORY_VIDEO_MS : STORY_MS;
    if (isVideo) {
      $('simg').innerHTML = `<video src="${sl.f}" autoplay muted playsinline loop></video>`;
    } else {
      $('simg').innerHTML = `<span>${sl.ph || sl.f}</span><img src="${sl.f}" alt="" onload="this.previousSibling.remove()" onerror="this.remove()">`;
    }

    const cur = $('sbars').children[sSlide].firstChild;
    void cur.offsetWidth;
    cur.style.transition = `width ${slideDuration}ms linear`;
    cur.style.width = '100%';

    clearTimeout(sTimer);
    sTimer = setTimeout(nextStory, slideDuration);
  }

  function nextStory() {
    const slides = storyList[sIdx].slides;
    if (sSlide < slides.length - 1) {
      sSlide++;
    } else if (sIdx < storyList.length - 1) {
      sIdx++;
      sSlide = 0;
    } else {
      closeStory();
      return;
    }
    renderStory();
  }

  function prevStory() {
    if (sSlide > 0) {
      sSlide--;
    } else if (sIdx > 0) {
      sIdx--;
      sSlide = 0;
    }
    renderStory();
  }

  function closeStory() {
    clearTimeout(sTimer);
    $('story').classList.remove('show');
    storyList = igStories;
  }

  $('istories').addEventListener('click', e => {
    const s = e.target.closest('.story.act');
    if (s) openStory(Number(s.dataset.i));
  });
  $('snext').addEventListener('click', nextStory);
  $('sprev').addEventListener('click', prevStory);
  $('sclose').addEventListener('click', closeStory);

  /* ----- DM ----- */
  function renderDMList() {
    $('dmlist').innerHTML = igUsers
      .map((u, i) => ({ u, i, m: igLast(u) }))
      .filter(x => x.m)
      .map(({ u, i, m }) =>
        `<div class="dmrow" data-i="${i}">${igAv(u, 56)}` +
        `<div class="ct"><div class="nm">${u.name}</div><div class="ln">${m.me ? '나: ' : ''}${igPrev(m)} · ${m.time}</div></div>` +
        `<span class="cam">${igi.cam}</span></div>`
      ).join('');
  }
  renderDMList();

  function openDMRoom(u) {
    $('dmav').innerHTML = igAv(u, 34);
    $('dmname').textContent = u.name;
    $('dmhandle').textContent = u.handle;

    const log = igDMs[u.handle] || [];
    $('dmbody').innerHTML = log.map(d =>
      `<div class="dsep2">${d.date}</div>` +
      d.msgs.map((m, k) => {
        const nxt = d.msgs[k + 1];
        const endOfGroup = !nxt || nxt.me !== m.me;
        const bb = m.img
          ? `<div class="bb img-only"><img class="chat-img" src="${m.img}" alt=""></div>`
          : `<div class="bb">${m.t}</div>`;
        if (m.me) return `<div class="dm me">${bb}</div>`;
        return `<div class="dm">${endOfGroup ? igAv(u, 28) : '<div class="sp28"></div>'}${bb}</div>`;
      }).join('')
    ).join('');

    $('idmroom').classList.add('show');
    $('dmbody').scrollTop = $('dmbody').scrollHeight;
    $('dmbody').querySelectorAll('.chat-img').forEach(img =>
      img.addEventListener('load', () => { $('dmbody').scrollTop = $('dmbody').scrollHeight; })
    );
  }

  $('dmback').addEventListener('click', () => $('idm').classList.remove('show'));
  $('drback').addEventListener('click', () => $('idmroom').classList.remove('show'));
  $('dmlist').addEventListener('click', e => {
    const r = e.target.closest('.dmrow');
    if (r) openDMRoom(igUsers[Number(r.dataset.i)]);
  });
  /* DM 속 사진도 눌러서 크게 보기 */
  $('dmbody').addEventListener('click', e => {
    const img = e.target.closest('.chat-img');
    if (!img) return;
    $('viewerImg').src = img.src;
    $('viewer').classList.add('show');
  });

  function openInsta() {
    insta.classList.add('show');
  }

  /* =====================================================
     인스타그램 프로필 화면 (동작 코드 — 건드리지 않아도 돼요)
     내 프로필 / 피드의 이름 / 스토리 위쪽 이름을 누르면 열려요.
     ===================================================== */
  Object.assign(igi, {
    grid:  svg('<rect x="3" y="3" width="18" height="18" rx="1.5"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>'),
    tag:   svg('<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="10" r="2.6"/><path d="M6.8 19c.7-2.7 2.7-4 5.2-4s4.5 1.3 5.2 4"/>'),
    menu:  svg('<path d="M3 6.5h18M3 12h18M3 17.5h18"/>'),
    bell:  svg('<path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15l1.5-2z"/><path d="M10 21.5h4"/>'),
    chev:  svg('<path d="m6 9 6 6 6-6"/>'),
    addp:  svg('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.7 2.9-6 6.5-6s6.5 2.3 6.5 6"/><path d="M19 8v6M16 11h6"/>'),
    pin:   svg('<path d="M14 3l7 7-3 1-3.5 3.5.5 4-1.5 1.5-4-4L5 21l-1-1 4.5-4.5-4-4L6 10l4 .5L13.5 7 14 3z"/>'),
    multi: svg('<path d="M7 3h12a2 2 0 0 1 2 2v12h-2V5H7V3z"/><rect x="3" y="7" width="14" height="14" rx="2"/>'),
    play:  svg('<path d="M7 4.5v15l12-7.5-12-7.5z"/>'),
    newhl: svg('<path d="M12 5v14M5 12h14"/>')
  });

  const fmtN = n => typeof n === 'string' ? n
    : n >= 10000 ? (n / 10000).toFixed(1).replace(/\.0$/, '') + '만'
    : n.toLocaleString('ko-KR');
  const userOf = h => igUsers.find(x => x.handle === h) || { handle: h, name: h, ph: '', f: '' };
  const imgTag = (f, extra) => `<span>${f}</span><img src="${f}" alt=""${extra || ''} onload="this.previousSibling.remove()" onerror="this.remove()">`;

  const PF_TABS = [['posts', igi.grid], ['reels', igi.reels], ['tagged', igi.tag]];
  const PF_TITLES = { posts: '게시물', reels: '릴스', tagged: '게시물' };
  const PF_EMPTY = { posts: '아직 게시물이 없습니다', reels: '릴스 없음', tagged: '태그된 사진 없음' };
  let pfHandle = null, pfTab = 'posts', pdList = [];

  document.documentElement.style.setProperty('--ratio', GRID_RATIO);

  function setItab(which) {
    $('itabs').querySelectorAll('.itab').forEach(t => t.classList.toggle('on', t.dataset.tab === which));
  }

  /* 위쪽: 사진 · 숫자 · 소개 · 버튼 */
  function renderPfInfo() {
    const u = userOf(pfHandle), pr = igProfiles[pfHandle];
    const mine = pfHandle === igMe.handle;
    const si = igStories.findIndex(s => igUsers[s.u].handle === pfHandle);
    const ring = si < 0 ? 'none' : (igStories[si].seen ? 'seen' : '');
    const cnt = pr.postCount != null ? pr.postCount : (pr.posts || []).length;

    const btns = mine
      ? `<div class="pfbtn">프로필 편집</div><div class="pfbtn">프로필 공유</div><div class="pfbtn sq">${igi.addp}</div>`
      : (pr.isFollowing
          ? `<div class="pfbtn" data-act="follow">팔로잉 ${igi.chev}</div>`
          : `<div class="pfbtn blue" data-act="follow">팔로우</div>`) +
        `<div class="pfbtn" data-act="msg">메시지</div><div class="pfbtn sq">${igi.addp}</div>`;

    $('pfinfo').innerHTML =
      `<div class="pftop"><div class="pavring ${ring}"${si >= 0 ? ` data-si="${si}"` : ''}><div class="in">${igAv(u, 80)}</div>${mine ? '<span class="plus">+</span>' : ''}</div>` +
        `<div class="pfstats"><div><b>${fmtN(cnt)}</b><span>게시물</span></div><div><b>${fmtN(pr.followers || 0)}</b><span>팔로워</span></div><div><b>${fmtN(pr.following || 0)}</b><span>팔로잉</span></div></div></div>` +
      `<div class="pfbio"><div class="nm">${u.name}</div>${pr.bio ? `<div class="bio">${pr.bio}</div>` : ''}${pr.link ? `<div class="lnk">${pr.link}</div>` : ''}</div>` +
      `<div class="pfbtns">${btns}</div>`;
  }

  /* 스토리 하이라이트 */
  function renderPfHls() {
    const pr = igProfiles[pfHandle], mine = pfHandle === igMe.handle;
    const list = pr.highlights || [];
    if (!mine && !list.length) { $('pfhls').innerHTML = ''; return; }
    $('pfhls').innerHTML = '<div class="hls">' +
      (mine ? `<div class="hl new"><div class="cv"><div class="im">${igi.newhl}</div></div><div class="nm">신규</div></div>` : '') +
      list.map((h, i) => {
        const cv = h.cover || (h.slides && h.slides[0] && h.slides[0].f) || '';
        return `<div class="hl" data-i="${i}"><div class="cv"><div class="im">${imgTag(cv)}</div></div><div class="nm">${h.title}</div></div>`;
      }).join('') + '</div>';
  }

  function renderPfTabs() {
    $('pftabs').innerHTML = PF_TABS.map(t => `<div class="pftab${t[0] === pfTab ? ' on' : ''}" data-t="${t[0]}">${t[1]}</div>`).join('');
  }

  /* 게시물 칸 모음 */
  function renderPfGrid() {
    const list = igProfiles[pfHandle][pfTab] || [];
    if (!list.length) { $('pfgridwrap').innerHTML = `<div class="pfempty">${PF_EMPTY[pfTab]}</div>`; return; }
    $('pfgridwrap').innerHTML = '<div class="pfgrid">' + list.map((p, i) => {
      const first = p.imgs && p.imgs.length ? p.imgs[0] : p.f;
      return `<div class="gcell" data-i="${i}">${imgTag(first)}` +
        (p.pinned ? `<div class="ov l">${igi.pin}</div>` : '') +
        (p.imgs && p.imgs.length > 1 ? `<div class="ov r">${igi.multi}</div>` : '') +
        (pfTab === 'reels' && !p.views ? `<div class="ov r">${igi.play}</div>` : '') +
        (p.views ? `<div class="vw">${igi.play}${p.views}</div>` : '') + `</div>`;
    }).join('') + '</div>';
  }

  function openProfile(handle) {
    if (!igProfiles[handle]) return;
    pfHandle = handle;
    pfTab = 'posts';
    const mine = handle === igMe.handle;
    $('iprof').innerHTML =
      `<div class="pfhead">` + (mine
        ? `<div class="hd">${handle}${igi.chev}</div><div class="icons">${igi.plus}${igi.menu}</div>`
        : `<span class="back" id="pfback">‹</span><div class="hd">${handle}</div><div class="icons">${igi.bell}<span class="mdot">⋯</span></div>`) + `</div>` +
      `<div class="pfbody" id="pfbody"><div id="pfinfo"></div><div id="pfhls"></div><div class="pftabs" id="pftabs"></div><div id="pfgridwrap"></div></div>`;
    renderPfInfo(); renderPfHls(); renderPfTabs(); renderPfGrid();
    $('ipost').classList.remove('show');
    $('iprof').classList.add('show');
    setItab(mine ? 'me' : 'home');
  }

  function closePostDetail() { $('ipost').classList.remove('show'); }
  function closeProfiles() {
    $('ipost').classList.remove('show');
    $('iprof').classList.remove('show');
    pfHandle = null;
    setItab('home');
  }

  /* 하이라이트 → 스토리 화면으로 열기 */
  function openHighlight(handle, hi) {
    const h = igProfiles[handle].highlights[hi];
    if (!h || !h.slides || !h.slides.length) return;
    storyList = [{ u: igUsers.findIndex(x => x.handle === handle), slides: h.slides }];
    sIdx = 0; sSlide = 0;
    $('story').classList.add('show');
    renderStory();
  }

  /* 게시물 보기 (누른 게시물부터 아래로 이어서 보여줘요) */
  function pdPostHTML(p, i) {
    const u = userOf(p.by || pfHandle);
    const photos = p.imgs && p.imgs.length ? p.imgs : [p.f];
    const media = photos.length > 1
      ? `<div class="car"><div class="cts">${photos.map(f => `<div class="cs">${imgTag(f)}</div>`).join('')}</div><div class="cnt">1/${photos.length}</div></div>`
      : `<div class="post-img">${imgTag(photos[0])}</div>`;
    const dots = photos.length > 1 ? `<div class="cdots">${photos.map((_, k) => `<i${k === 0 ? ' class="on"' : ''}></i>`).join('')}</div>` : '';
    return `<div class="post" data-i="${i}">` +
      `<div class="phead" data-h="${u.handle}">${igAv(u, 32)}<b>${u.handle}</b><span class="more">⋯</span></div>` +
      media +

  function setLikeDetail(el, p, on, pop) {
    if (!!p.liked !== on) {
      p.liked = on;
      p.likes = (typeof p.likes === 'number' ? p.likes : 0) + (on ? 1 : -1);
    }
    const btn = el.querySelector('.lk-btn');
    btn.classList.toggle('on', !!p.liked);
    el.querySelector('.lk-n').textContent = `좋아요 ${fmtN(p.likes || 0)}개`;

  /* ----- 눌렀을 때 동작 ----- */
  $('iprof').addEventListener('click', e => {

    if (ring) { openStory(Number(ring.dataset.si)); return; }

    const hl = e.target.closest('.hl[data-i]');
    if (hl) { openHighlight(pfHandle, Number(hl.dataset.i)); return; }

    if (tb) { pfTab = tb.dataset.t; renderPfTabs(); renderPfGrid(); return; }

    const gc = e.target.closest('.gcell');
    if (gc) { openPostDetail(Number(gc.dataset.i)); return; }

    const bt = e.target.closest('.pfbtn[data-act]');
    if (bt) {
      const pr = igProfiles[pfHandle];
      if (bt.dataset.act === 'follow') {
        pr.isFollowing = !pr.isFollowing;
        if (typeof pr.followers === 'number') pr.followers += pr.isFollowing ? 1 : -1;
        renderPfInfo();

  $('ipost').addEventListener('click', e => {

    const head = e.target.closest('.phead[data-h]');
    if (head && !e.target.closest('.more')) {
      const h = head.dataset.h;
      if (h !== pfHandle && igProfiles[h]) openProfile(h);
      else closePostDetail();
      return;

    const el = e.target.closest('.post');
    if (!el) return;
    const p = pdList[Number(el.dataset.i)];

    if (e.target.closest('.lk-btn')) { setLikeDetail(el, p, !p.liked, true); return; }

    const media = e.target.closest('.post-img, .car');
    if (media) {
      const now = Date.now();
      if (now - Number(media.dataset.t || 0) < 350) {
        setLikeDetail(el, p, true, true);
        bigHeart(media);
        media.dataset.t = 0;
      } else {
        media.dataset.t = now;
      }

  /* =====================================================
     전화 앱 (아이폰 전화 앱처럼: 즐겨찾기 · 최근 통화 · 연락처 · 키패드 · 음성 메시지)
     연락처를 누르면 전화를 걸 수 있지만, 상대는 받지 않아요. (빨간 버튼으로 끊기)
     ===================================================== */
  const tel = $('tel');
  const TEL_ROW_PHOTOS = false;   // true 로 바꾸면 연락처 목록에도 기본 프로필 사진이 보여요 (진짜 아이폰은 이름만 보여요)

  /* ★ 연락처: 이름 · 번호 (번호는 마음대로 바꾸세요) */
  const telContacts = [
    { name: '김운학', num: '010-1234-1129' },
    { name: '명재현', num: '010-1234-1204' },
    { name: '우지호', num: '010-1234-0914' },
    { name: '부희주', num: '010-1234-0912' },
    { name: '정사이', num: '010-1234-4242' },
    { name: '시준휘', num: '010-1234-0612' },
    { name: '엄마',   num: '010-1234-520' },
    { name: '아빠',   num: '010-1234-520' }
  ].sort((a, b) => a.name.localeCompare(b.name, 'ko'));

  const CHO = ['ㄱ','ㄱ','ㄴ','ㄷ','ㄷ','ㄹ','ㅁ','ㅂ','ㅂ','ㅅ','ㅅ','ㅇ','ㅈ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const telInitial = n => { const c = n.charCodeAt(0) - 0xAC00; return c >= 0 && c < 11172 ? CHO[Math.floor(c / 588)] : '#'; };
  const telAv = size => `<div class="tav" style="width:${size}px;height:${size}px"><svg viewBox="0 0 24 24"><path d="M12 12.4a4.1 4.1 0 1 0 0-8.2 4.1 4.1 0 0 0 0 8.2zM4.5 21c.4-4 3.4-6.2 7.5-6.2s7.1 2.2 7.5 6.2z"/></svg></div>`;

  const PHONE_PATH = 'M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2z';
  const tsv = inner => `<svg viewBox="0 0 24 24">${inner}</svg>`;
  const TEL_TABS = [
    ['favorites', tsv('<path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 17l-5.2 2.7 1-5.9-4.3-4.1 5.9-.8z"/>'), '즐겨찾기'],
    ['recents',   tsv('<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.2 2"/>'), '최근 통화'],

    ['keypad',    tsv('<g fill="currentColor" stroke="none"><circle cx="6" cy="4.5" r="1.5"/><circle cx="12" cy="4.5" r="1.5"/><circle cx="18" cy="4.5" r="1.5"/><circle cx="6" cy="9.5" r="1.5"/><circle cx="12" cy="9.5" r="1.5"/><circle cx="18" cy="9.5" r="1.5"/><circle cx="6" cy="14.5" r="1.5"/><circle cx="12" cy="14.5" r="1.5"/><circle cx="18" cy="14.5" r="1.5"/><circle cx="12" cy="19.5" r="1.5"/></g>'), '키패드'],
    ['voicemail', tsv('<circle cx="7.5" cy="12" r="3.5"/><circle cx="16.5" cy="12" r="3.5"/><path d="M7.5 15.5h9"/>'), '음성 메시지']
  ];
  const KP_KEYS = [['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']];
  const TEL_IDX = ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ','#'];

  let telTab = 'contacts', telDial = '', telRecents = [], telRecAll = true, callActive = null;

  const telClock = () => new Date().toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit', hour12: true });
  const telFmt = d => d.length <= 3 ? d : d.length <= 7 ? d.slice(0, 3) + '-' + d.slice(3) : d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7);
  const telDisp = d => /[*#+]/.test(d) ? d : telFmt(d);
  const telNav = (l, m, r) => `<div class="tnav"><span>${l}</span>${m}<span>${r}</span></div>`;

  function renderTel() {
    let h = '';
    if (telTab === 'contacts') {
      let last = '';
      const rows = telContacts.map((c, i) => {
        const k = telInitial(c.name);
        const head = k !== last ? `<div class="tsec">${k}</div>` : '';
        last = k;
        return head + `<div class="trow" data-ci="${i}">${TEL_ROW_PHOTOS ? telAv(34) : ''}<span class="rb">${c.name}</span></div>`;
      }).join('');
      h = telNav('그룹', '', '<span class="plus">＋</span>') +
        `<div class="ttitle">연락처</div>` +
        `<div class="tsearch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>검색</div>` +
        `<div class="tmy">${telAv(54)}<div><b>문하나</b><small>내 카드</small></div></div>` + rows;
    } else if (telTab === 'recents') {
      const list = telRecAll ? telRecents : [];
      const rows = list.map((r, i) =>
        `<div class="trow" data-rc="${i}"><div class="rb"><div>${r.name}</div>` +
        `<small><svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg>휴대전화</small></div>` +
        `<span class="rt">${r.time}</span><span class="ri">ⓘ</span></div>`).join('');
      h = telNav('편집', `<div class="tseg"><b class="${telRecAll ? 'on' : ''}" data-f="all">전체</b><b class="${telRecAll ? '' : 'on'}" data-f="missed">부재중</b></div>`, '<span style="visibility:hidden">편집</span>') +
        `<div class="ttitle">최근 통화</div>` + (rows || `<div class="tempty">최근 통화 없음</div>`);
    } else if (telTab === 'keypad') {
      h = `<div class="kpwrap"><div class="kpnum">${telDisp(telDial)}</div><div class="kpadd">${telDial ? '번호 추가' : ''}</div><div class="kpgrid">` +
        KP_KEYS.map(([n, l]) => `<div class="tkey" data-k="${n}"><b>${n}</b><small>${l}</small></div>`).join('') +
        `<span></span><div class="tkcall"><svg viewBox="0 0 24 24"><path d="${PHONE_PATH}"/></svg></div>` +
        `<div class="tkdel" style="visibility:${telDial ? 'visible' : 'hidden'}">${tsv('<path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z"/><path d="m13 9.5 5 5M18 9.5l-5 5"/>')}</div></div></div>`;
    } else if (telTab === 'favorites') {
      h = telNav('편집', '', '<span class="plus">＋</span>') + `<div class="ttitle">즐겨찾기</div>`;
    } else {
      h = telNav('', '', '') + `<div class="ttitle">음성 메시지</div><div class="tempty">음성 메시지 없음</div>`;
    }
    $('tmain').innerHTML = h;
    $('tidx').style.display = telTab === 'contacts' ? 'flex' : 'none';
    $('ttabs').innerHTML = TEL_TABS.map(t => `<div class="ttab${t[0] === telTab ? ' on' : ''}" data-t="${t[0]}">${t[1]}${t[2]}</div>`).join('');
  }
  $('tidx').innerHTML = TEL_IDX.map(x => `<span>${x}</span>`).join('');

  function openTel() {
    tel.classList.add('show');
    renderTel();
  }
  /* 전화 앱 닫기 (통화 중이면 끊고 최근 통화에 남겨요) */
  function closeTel() {
    endCall();
    $('telcard').classList.remove('show');
    tel.classList.remove('show');
  }

  /* 전화 걸기: 계속 신호만 가고 상대는 받지 않아요 */
  function startCall(name) {
    callActive = { name };
    const cb = (label, icon, tg) => `<div class="cbi"><div class="cbc"${tg ? ' data-tg="1"' : ''}>${tsv(icon)}</div>${label}</div>`;
    $('telcall').innerHTML =
      `<div class="cwho"><div class="cname">${name}</div><div class="cst">전화 거는 중...</div></div>` +
      `<div class="cgrid">` +
        cb('소리 끔', '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M4 4l16 16"/>', true) +
        cb('키패드', '<g fill="#fff" stroke="none"><circle cx="6" cy="5" r="1.7"/><circle cx="12" cy="5" r="1.7"/><circle cx="18" cy="5" r="1.7"/><circle cx="6" cy="11" r="1.7"/><circle cx="12" cy="11" r="1.7"/><circle cx="18" cy="11" r="1.7"/><circle cx="6" cy="17" r="1.7"/><circle cx="12" cy="17" r="1.7"/><circle cx="18" cy="17" r="1.7"/></g>') +
        cb('스피커', '<path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/>', true) +
        cb('통화 추가', '<path d="M12 5v14M5 12h14"/>') +
        cb('FaceTime', '<rect x="3" y="7" width="12" height="10" rx="2.5"/><path d="m15 11 6-3.5v9L15 13"/>') +
        cb('연락처', '<circle cx="12" cy="9" r="3.5"/><path d="M5 20c.8-3.6 3.5-5.5 7-5.5s6.2 1.9 7 5.5"/>') +
      `</div><div class="cend"><svg viewBox="0 0 24 24"><path d="${PHONE_PATH}"/></svg></div>`;
    $('telcall').classList.add('show');
  }
  function endCall() {
    if (!callActive) return;
    telRecents.unshift({ name: callActive.name, time: telClock() });
    callActive = null;
    $('telcall').classList.remove('show');
    if (tel.classList.contains('show') && telTab === 'recents') renderTel();
  }

  function openTelCard(i) {
    const c = telContacts[i];
    const act = (label, inner, filled) => `<div class="tcact"${label === '통화' ? ` data-call="${i}"` : ''}>${filled ? `<svg class="f" viewBox="0 0 24 24">${inner}</svg>` : tsv(inner)}${label}</div>`;
    $('telcard').innerHTML =
      `<div class="tnav"><span class="tback" id="tcback">‹ 연락처</span><span>편집</span></div>` +
      `<div class="tcbody">${telAv(112)}<div class="tcname">${c.name}</div><div class="tcacts">` +
        act('메시지', '<path d="M21 11.5a8.4 8.4 0 0 1-12.2 7.5L3 20.5l1.6-5A8.4 8.4 0 1 1 21 11.5z"/>') +
        act('통화', `<path d="${PHONE_PATH}"/>`, true) +
        act('영상 통화', '<rect x="3" y="7" width="12" height="10" rx="2.5"/><path d="m15 11 6-3.5v9L15 13"/>') +
        act('메일', '<rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="m4 8 8 5.5L20 8"/>') +
      `</div><div class="tccard"><small>휴대전화</small><div class="tcnum" data-call="${i}">${c.num}</div></div></div>`;
    $('telcard').classList.add('show');

  /* 눌렀을 때 동작 */
  $('ttabs').addEventListener('click', e => {
    const t = e.target.closest('.ttab');
    if (!t) return;
    telTab = t.dataset.t;
    $('telcard').classList.remove('show');
    renderTel();
  });
  $('tmain').addEventListener('click', e => {
    const k = e.target.closest('.tkey');
    if (k) { if (telDial.length < 15) telDial += k.dataset.k; renderTel(); return; }
    if (e.target.closest('.tkdel')) { telDial = telDial.slice(0, -1); renderTel(); return; }
    if (e.target.closest('.tkcall')) {
      if (!telDial) return;
      const c = telContacts.find(x => x.num.replace(/\D/g, '') === telDial);
      startCall(c ? c.name : telDisp(telDial));
      return;
    }
    const r = e.target.closest('.trow[data-ci]');
    if (r) { openTelCard(Number(r.dataset.ci)); return; }
    const rc = e.target.closest('.trow[data-rc]');
    if (rc) { startCall(telRecents[Number(rc.dataset.rc)].name); return; }
    const sg = e.target.closest('.tseg b');
    if (sg) { telRecAll = sg.dataset.f === 'all'; renderTel(); }
  });
  $('telcard').addEventListener('click', e => {
    if (e.target.closest('#tcback')) { $('telcard').classList.remove('show'); return; }
    const c = e.target.closest('[data-call]');
    if (c) startCall(telContacts[Number(c.dataset.call)].name);

  $('telcall').addEventListener('click', e => {

  /* 인스타그램 앱 하단 홈 표시줄을 누르면 아이폰 기본 홈 화면으로 이동 */
  function returnToPhoneHome() {
    stopVoice();
    // 열려 있는 앱과 앱 내부 팝업을 모두 닫습니다.
    kakao.classList.remove('show');
    room.classList.remove('show');
    $('kprofile').classList.remove('show');
    insta.classList.remove('show');
    $('blog').classList.remove('show');
    $('idm').classList.remove('show');
    $('idmroom').classList.remove('show');
    closeStory();

    closeViewer();
    clearInput();
    closeProfiles();

    // 잠금/암호 화면이 아니라 앱 아이콘이 있는 홈 화면을 표시합니다.
    home.classList.add('show');

  /* 인스타·전화 앱의 홈 표시줄 (짧게 누르거나 위로 밀면 홈으로) */
  [$('ihome'), $('telhome')].forEach(bar => {
    let startYb = null;
    bar.addEventListener('pointerdown', e => { startYb = e.clientY; });
    bar.addEventListener('pointerup', e => {
      if (startYb === null) return;
      const moved = e.clientY - startYb;
      startYb = null;
      if (Math.abs(moved) < 25 || moved < -30) returnToPhoneHome();
    });
    bar.addEventListener('pointercancel', () => { startYb = null; });
  });

  /* =====================================================
     사진 미리 불러오기: 화면이 열리면 뒤에서 조용히 모든 사진을 받아 둬요.
     (앱을 열었을 때 사진이 바로 뜨도록. 한 번에 4장씩만 받아서 느려지지 않아요)
     ===================================================== */
  (function preloadImages() {
    const files = new Set();
    const add = f => { if (f && !/\.mp4$/i.test(f)) files.add(f); };

    ['wallpaper.jpeg', 'flashlight.png', 'camera.png', 'chat.png', 'phone.png', 'hansu.jpg', 'woonhak_wallpaper.jpeg'].forEach(f => add(f));
    apps.concat(dockApps).forEach(a => add(a.f));
    friendList.forEach(f => { add(f.f); add(f.bg); });
    igUsers.forEach(u => add(u.f));
    igStories.forEach(st => st.slides.forEach(sl => add(sl.f)));
    igPosts.forEach(po => add(po.f));
    Object.values(chats).forEach(log => log.forEach(d => d.msgs.forEach(m => add(m.img))));
    groupChats.forEach(g => g.days.forEach(d => d.msgs.forEach(m => add(m.img))));
    Object.values(igProfiles).forEach(pr => {
      (pr.highlights || []).forEach(h => { add(h.cover); (h.slides || []).forEach(sl => add(sl.f)); });
      ['posts', 'reels', 'tagged'].forEach(k => (pr[k] || []).forEach(po => {
        add(po.f);
        (po.imgs || []).forEach(x => add(x));
      }));
    });

    loadVoiceDur('um.mp3');

    const queue = [...files];
    const keep = [];   // 받아 둔 사진이 사라지지 않게 붙잡아 둬요
    function next() {
      const f = queue.shift();
      if (!f) return;
      const im = new Image();
      im.onload = im.onerror = next;
      im.src = f;
      keep.push(im);
    }
    function start() { for (let k = 0; k < 4; k++) next(); }
    if (document.readyState === 'complete') start();
    else window.addEventListener('load', start);
  })();
</script>
</body>
</html>
